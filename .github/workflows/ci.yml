name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: just ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is linux/amd64, macos-latest is macos/arm64.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install prettier
        run: npm install -g prettier

      - name: Install Go formatters
        run: |
          go install mvdan.cc/gofumpt@latest
          go install github.com/daixiang0/gci@latest
          go install mvdan.cc/sh/v3/cmd/shfmt@latest

      - name: Install shellcheck and treefmt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          curl -fsSL https://github.com/numtide/treefmt/releases/download/v2.6.0/treefmt_2.6.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin treefmt

      - name: Install shellcheck and treefmt (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck treefmt

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-only: true

      # Model-dependent tests skip themselves when models/ is absent, which is always the case here.
      - name: just ci
        run: just ci
