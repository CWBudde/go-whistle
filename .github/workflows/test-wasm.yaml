name: test-wasm

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Builds web/whistle.wasm (cmd/whistle-wasm and the library), runs the package tests under Node
      # (go_js_wasm_exec; the model-gated ones skip) and the page's headless check (the resampler; no model).
      - name: Run js/wasm tests
        run: just wasm-test
