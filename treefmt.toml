# treefmt configuration for go-whistle
# Multi-language code formatting

[global]
excludes = [
    # Git and version control
    "**/.gitignore",
    "**/.git/**",

    # Go module files (managed by go tooling)
    "go.sum",
    "go.mod",

    # Documentation and text files
    "**/*.txt",
    "CHANGELOG.md",
    "LICENSE",

    # Binary and data files
    "**/*.wav",
    "**/*.pdf",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",

    # Oracle fixtures, written by tools/oracle; kept byte-exact so a regeneration diffs clean
    "testdata/audio/**",
    "testdata/oracle/**",
    # Tokenizer fixture, written by scripts/tokenizer_fixture.py; same reason
    "testdata/tokenizer/**",

    # Build artifacts
    "bin/**",
    "dist/**",
    "coverage.out",
    "coverage.html",
    # Go's wasm_exec.js, copied by just wasm
    "web/wasm_exec.js",
]

# Go formatter - simple and strict
[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]

# Go import organizer - runs after gofumpt
[formatter.gci]
command = "gci"
options = ["write"]
includes = ["*.go"]
priority = 1

# Shell script checker
[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh"]

# Shell script formatter - runs after shellcheck
[formatter.shfmt]
command = "shfmt"
options = ["-s", "-w"]
includes = ["*.sh"]
priority = 1

# Markdown, YAML, JSON and the web demo's HTML, CSS and JavaScript formatter
[formatter.prettier]
command = "prettier"
options = ["-w"]
includes = [
    "*.md",
    "*.yaml",
    "*.yml",
    "*.json",
    "*.html",
    "*.css",
    "*.js",
    "*.mjs",
]
excludes = [
    # Exclude potentially sensitive or auto-generated files
    "**/*.sops.*",
]
